groups:
  - name: uptime-monitor
    rules:
      # The whole point of the service is to run checks. If the worker has not
      # completed a single check for 5 minutes, something is broken (worker down,
      # beat down, broker down, or no active monitors).
      - alert: NoChecksPerformed
        expr: sum(increase(uptime_checks_total[5m])) == 0 or absent(uptime_checks_total)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No checks performed in the last 5 minutes"

      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"

      - alert: High5xxRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of API requests fail with 5xx"
