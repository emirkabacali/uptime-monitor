# Prometheus PULLS metrics: every 15 seconds it scrapes the targets below over
# the internal Docker network. Nothing here is reachable from the internet.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]
