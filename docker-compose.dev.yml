# Development override: publish PostgreSQL and Redis on localhost only, so that
# `uv run uvicorn ...`, `uv run celery ...` and `uv run pytest` can reach them.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
# Host port 5433 avoids clashing with a locally installed PostgreSQL.
services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
