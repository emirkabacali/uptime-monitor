services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: uptime
    ports:
      # Bound to localhost only: reachable from the dev machine, not from the network.
      # Host port 5433 avoids clashing with a locally installed PostgreSQL.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d uptime"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
